<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun Evi - Oynamak İçin Bir Oyun Seç</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Arka plan animasyon elemanları -->
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <div class="shape shape-5"></div>
        <div class="shape shape-6"></div>
        <div class="shape shape-7"></div>
        <div class="shape shape-8"></div>
    </div>

    <!-- Header Alanı -->
    <header class="main-header">
        <h1 class="neon-title">OYUN EVİ</h1>
        <p class="subtitle">
            <span class="cursor-blink">Oynamak için bir oyun seç...</span>
            <span class="blinking-cursor">|</span>
        </p>
    </header>

    <!-- Oyun Koleksiyonu Alanı -->
    <main class="games-container">
        <div id="oyun-kartlari" class="games-grid">
            <!-- Oyun kartları JavaScript ile buraya yüklenecek -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
        <p class="neon-slogan">✨ Tıkla ve Oynamaya Başla ✨</p>
        <p class="footer-copy">&copy; 2026 Oyun Evi - Tüm Hakları Saklıdır</p>
    </footer>
    <div id="sayac-kutusu" style="
    position: fixed;
    bottom: 10px;
    right: 10px;
    background: #1a1a1a;
    color: #00ff00;
    padding: 10px;
    border-radius: 8px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 13px;
    border: 1px solid #333;
    z-index: 9999;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
">
    🌐 <span id="sayi">Yükleniyor...</span> Ziyaret
</div>

<script>
    async function sayaciGuncelle() {
        const anahtar = "oyunevi-toplam-2026"; // Bunu kendine özel bir kelime yap
        const url = `https://api.countapi.it/hit/oyun-evi-site/${anahtar}`;

        try {
            const response = await fetch(url);
            const data = await response.json();
            document.getElementById('sayi').innerText = data.value;
        } catch (error) {
            // Eğer servis hata verirse, en azından "Hata" yerine şık bir simge gösterir
            document.getElementById('sayi').innerText = "---";
            console.log("Sayaç servisinden yanıt alınamadı.");
        }
    }

    sayaciGuncelle();
</script>
    <script src="script.js"></script>
</body>
</html>
