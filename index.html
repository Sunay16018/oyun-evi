<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun Evi - Oynamak İçin Bir Oyun Seç</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Arka plan animasyon elemanları -->
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <div class="shape shape-5"></div>
        <div class="shape shape-6"></div>
        <div class="shape shape-7"></div>
        <div class="shape shape-8"></div>
    </div>

    <!-- Header Alanı -->
    <header class="main-header">
        <h1 class="neon-title">OYUN EVİ</h1>
        <p class="subtitle">
            <span class="cursor-blink">Oynamak için bir oyun seç...</span>
            <span class="blinking-cursor">|</span>
        </p>
    </header>

    <!-- Oyun Koleksiyonu Alanı -->
    <main class="games-container">
        <div id="oyun-kartlari" class="games-grid">
            <!-- Oyun kartları JavaScript ile buraya yüklenecek -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
        <p class="neon-slogan">✨ Tıkla ve Oynamaya Başla ✨</p>
        <p class="footer-copy">&copy; 2026 Oyun Evi - Tüm Hakları Saklıdır</p>
    </footer>
    <div id="sayac-kutusu" style="
    position: fixed;
    bottom: 10px;
    right: 10px;
    background: #222;
    color: #00ff00;
    padding: 8px 15px;
    border-radius: 5px;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    border: 1px solid #444;
    z-index: 9999;
">
    Ziyaretçi: <span id="sayi">Yükleniyor...</span>
</div>

<script>
    // Bu fonksiyon CountAPI kullanarak sayıyı artırır ve çeker
    function ziyaretiKaydet() {
        // 'oyunevi-toplam-ziyaret' senin anahtarın. Bunu değiştirirsen sayaç sıfırlanır.
        const url = "https://api.countapi.xyz/hit/oyun-evi.vercel.app/oyunevi-toplam-ziyaret";

        fetch(url)
            .then(res => res.json())
            .then(data => {
                document.getElementById('sayi').innerText = data.value;
            })
            .catch(err => {
                document.getElementById('sayi').innerText = "Hata!";
                console.error(err);
            });
    }

    // Sayfa açıldığında çalıştır
    ziyaretiKaydet();
</script>
    <script src="script.js"></script>
</body>
</html>
