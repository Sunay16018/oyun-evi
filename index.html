<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun Evi - Oynamak İçin Bir Oyun Seç</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Arka plan animasyon elemanları -->
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <div class="shape shape-5"></div>
        <div class="shape shape-6"></div>
        <div class="shape shape-7"></div>
        <div class="shape shape-8"></div>
    </div>

    <!-- Header Alanı -->
    <header class="main-header">
        <h1 class="neon-title">OYUN EVİ</h1>
        <p class="subtitle">
            <span class="cursor-blink">Oynamak için bir oyun seç...</span>
            <span class="blinking-cursor">|</span>
        </p>
    </header>

    <!-- Oyun Koleksiyonu Alanı -->
    <main class="games-container">
        <div id="oyun-kartlari" class="games-grid">
            <!-- Oyun kartları JavaScript ile buraya yüklenecek -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
        <p class="neon-slogan">✨ Tıkla ve Oynamaya Başla ✨</p>
        <p class="footer-copy">&copy; 2026 Oyun Evi - Tüm Hakları Saklıdır</p>
    </footer>
    <div id="sayac-kutusu" style="
    position: fixed;
    bottom: 15px;
    right: 15px;
    background: rgba(0, 0, 0, 0.85);
    color: #00ffcc;
    padding: 12px;
    border-radius: 12px;
    font-family: 'Segoe UI', Roboto, sans-serif;
    font-size: 13px;
    border: 1px solid #00ffcc;
    z-index: 9999;
    text-align: center;
    box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
">
    <div style="font-weight: bold; letter-spacing: 1px; margin-bottom: 4px;">TOPLAM GİRİŞ</div>
    <div id="visit-count" style="font-size: 20px; font-weight: bold; color: #fff;">...</div>
</div>

<script>
function cb(response) {
    document.getElementById('visit-count').innerText = response.value;
}
</script>
<script async src="https://api.countapi.xyz/hit/oyunevi-vercel-app/visits?callback=cb"></script>

    <script src="script.js"></script>
</body>
</html>
