<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun Evi - Oynamak İçin Bir Oyun Seç</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Arka plan animasyon elemanları -->
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <div class="shape shape-5"></div>
        <div class="shape shape-6"></div>
        <div class="shape shape-7"></div>
        <div class="shape shape-8"></div>
    </div>

    <!-- Header Alanı -->
    <header class="main-header">
        <h1 class="neon-title">OYUN EVİ</h1>
        <p class="subtitle">
            <span class="cursor-blink">Oynamak için bir oyun seç...</span>
            <span class="blinking-cursor">|</span>
        </p>
    </header>

    <!-- Oyun Koleksiyonu Alanı -->
    <main class="games-container">
        <div id="oyun-kartlari" class="games-grid">
            <!-- Oyun kartları JavaScript ile buraya yüklenecek -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
        <p class="neon-slogan">✨ Tıkla ve Oynamaya Başla ✨</p>
        <p class="footer-copy">&copy; 2026 Oyun Evi - Tüm Hakları Saklıdır</p>
    </footer>
    <div id="sayac-kutusu" style="
    position: fixed;
    bottom: 10px;
    right: 10px;
    background: #000;
    color: #0f0;
    padding: 10px;
    border-radius: 10px;
    font-family: 'Courier New', Courier, monospace;
    font-size: 14px;
    border: 2px solid #333;
    z-index: 9999;
    text-align: center;
">
    <div style="margin-bottom: 5px;">TOPLAM ZİYARETÇİ</div>
    <!-- Güvenilir bir servis üzerinden resim olarak sayaç -->
    <img src="https://counter.secrethit.com/counter/display?page=oyunevi_2026_toplam&style=0012&nbdigits=5" alt="Sayaç" style="vertical-align: middle;">
</div>

    <script src="script.js"></script>
</body>
</html>
