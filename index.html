<!DOCTYPE html>
<html lang="tr">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3971316687404834"
     crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-3971316687404834">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun Evi - Oynamak İçin Bir Oyun Seç</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Sayaç Kutusu Tasarımı */
        #sayac-kutusu {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.85);
            color: #00ffcc;
            border: 2px solid #00ffcc;
            padding: 10px 15px;
            border-radius: 10px;
            font-family: 'Courier New', Courier, monospace;
            z-index: 9999;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            pointer-events: none; /* Tıklamaya engel olmasın */
            user-select: none;
        }

        #sayi {
            font-weight: bold;
            font-size: 1.1em;
            transition: all 0.5s ease;
            display: inline-block;
        }

        .online-dot {
            height: 10px;
            width: 10px;
            background-color: #00ffcc;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            box-shadow: 0 0 8px #00ffcc;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <div class="shape shape-5"></div>
        <div class="shape shape-6"></div>
        <div class="shape shape-7"></div>
        <div class="shape shape-8"></div>
    </div>

    <header class="main-header">
        <h1 class="neon-title">OYUN EVİ</h1>
        <p class="subtitle">
            <span class="cursor-blink">Oynamak için bir oyun seç...</span>
            <span class="blinking-cursor">|</span>
        </p>
    </header>

    <main class="games-container">
        <div id="oyun-kartlari" class="games-grid">
            </div>
    </main>

    <footer class="main-footer">
        <p class="neon-slogan">✨ Tıkla ve Oynamaya Başla ✨</p>
        <p class="footer-copy">&copy; 2026 Oyun Evi - Tüm Hakları Saklıdır</p>
    </footer>

    <div id="sayac-kutusu">
        <span class="online-dot"></span>
        ŞU AN: <span id="sayi">...</span> KİŞİ AKTİF
    </div>

    <script>
        /**
         * Aktiflik Sinyali (Heartbeat) Fonksiyonu
         * Bu fonksiyon her çağrıldığında veritabanına "ben buradayım" der
         * ve veritabanından o anki toplam aktif sayısını alır.
         */
        async function sinyalGonder() {
            try {
                // Tarayıcı önbelleğini (cache) kırmak için her seferinde farklı bir URL (?t=...)
                const response = await fetch(`/api/ziyaret?t=${Date.now()}`);
                const data = await response.json();
                
                if (data && data.miktar !== undefined) {
                    const sayiElementi = document.getElementById('sayi');
                    const yeniDeger = data.miktar.toString();

                    // Eğer sayı değişmişse görsel efektle güncelle
                    if (sayiElementi.innerText !== yeniDeger) {
                        sayiElementi.style.color = "#fff";
                        sayiElementi.style.transform = "scale(1.3)";
                        sayiElementi.innerText = yeniDeger;
                        
                        setTimeout(() => {
                            sayiElementi.style.color = "#00ffcc";
                            sayiElementi.style.transform = "scale(1)";
                        }, 500);
                    }
                }
            } catch (e) {
                console.error("Aktiflik verisi alınamadı:", e);
                document.getElementById('sayi').innerText = "?";
            }
        }

        // 1. Sayfa açılır açılmaz hemen ilk sinyali gönder
        sinyalGonder();

        // 2. Her 10 saniyede bir (10000 ms) sinyal göndermeye devam et.
        // Bu sayede kullanıcı sekmeyi kapatınca sinyal kesilir ve 30 saniye içinde listeden düşer.
        setInterval(sinyalGonder, 10000);
    </script>
    
    <script src="script.js"></script>
</body>
</html>
