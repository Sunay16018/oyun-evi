<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun Evi - Oynamak İçin Bir Oyun Seç</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <div class="shape shape-5"></div>
        <div class="shape shape-6"></div>
        <div class="shape shape-7"></div>
        <div class="shape shape-8"></div>
    </div>

    <header class="main-header">
        <h1 class="neon-title">OYUN EVİ</h1>
        <p class="subtitle">
            <span class="cursor-blink">Oynamak için bir oyun seç...</span>
            <span class="blinking-cursor">|</span>
        </p>
    </header>

    <main class="games-container">
        <div id="oyun-kartlari" class="games-grid">
            </div>
    </main>

    <footer class="main-footer">
        <p class="neon-slogan">✨ Tıkla ve Oynamaya Başla ✨</p>
        <p class="footer-copy">&copy; 2026 Oyun Evi - Tüm Hakları Saklıdır</p>
    </footer>

    <div id="sayac-kutusu" style="position:fixed; bottom:15px; right:15px; background:rgba(0,0,0,0.8); color:#00ffcc; border:2px solid #00ffcc; padding:10px; border-radius:10px; font-family:monospace; z-index:9999; box-shadow: 0 0 10px #00ffcc;">
        AKTİF KULLANICI: <span id="sayi">...</span>
    </div>

    <script>
        async function sayaciGuncelle() {
            try {
                // sessionStorage kullanarak bu sekmede daha önce saydırıp saydırmadığımızı kontrol ediyoruz
                // Bu sayede F5 yapınca sayı artmaz, sadece site ilk açıldığında artar.
                const hasVisited = sessionStorage.getItem('visited');
                
                // API'ye 'increase' parametresi gönderiyoruz (Eğer ilk gelişse artıracak)
                const url = hasVisited ? '/api/ziyaret' : '/api/ziyaret?artir=true';
                
                const response = await fetch(url);
                const data = await response.json();
                
                // Senin API 'miktar' gönderdiği için data.miktar kullanıyoruz
                if (data && data.miktar !== undefined) {
                    document.getElementById('sayi').innerText = data.miktar;
                    sessionStorage.setItem('visited', 'true');
                } else {
                    document.getElementById('sayi').innerText = "0";
                }
            } catch (e) {
                console.error("Sayaç hatası:", e);
                document.getElementById('sayi').innerText = "Hata";
            }
        }
        sayaciGuncelle();
    </script>
    
    <script src="script.js"></script>
</body>
</html>
