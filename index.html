<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun Evi - Oynamak İçin Bir Oyun Seç</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <div class="shape shape-5"></div>
        <div class="shape shape-6"></div>
        <div class="shape shape-7"></div>
        <div class="shape shape-8"></div>
    </div>

    <header class="main-header">
        <h1 class="neon-title">OYUN EVİ</h1>
        <p class="subtitle">
            <span class="cursor-blink">Oynamak için bir oyun seç...</span>
            <span class="blinking-cursor">|</span>
        </p>
    </header>

    <main class="games-container">
        <div id="oyun-kartlari" class="games-grid"></div>
    </main>

    <footer class="main-footer">
        <p class="neon-slogan">✨ Tıkla ve Oynamaya Başla ✨</p>
        <p class="footer-copy">&copy; 2026 Oyun Evi - Tüm Hakları Saklıdır</p>
    </footer>

    <div id="sayac-kutusu" style="position:fixed; bottom:15px; right:15px; background:rgba(0,0,0,0.85); color:#00ffcc; border:2px solid #00ffcc; padding:10px 15px; border-radius:10px; font-family:monospace; z-index:9999; box-shadow: 0 0 10px rgba(0,255,204,0.5);">
        ZİYARETÇİ: <span id="sayi">...</span>
    </div>

    <script>
        // 1. Sayfa ilk açıldığında IP kontrolüyle artır/oku
        async function ilkGiris() {
            try {
                const response = await fetch('/api/ziyaret?ilk=true');
                const data = await response.json();
                if (data && data.miktar !== undefined) {
                    document.getElementById('sayi').innerText = data.miktar;
                }
            } catch (e) { console.error("Giriş hatası:", e); }
        }

        // 2. Anlık güncelleme (Sadece oku)
        async function anlikGuncelle() {
            try {
                const response = await fetch('/api/ziyaret');
                const data = await response.json();
                if (data && data.miktar !== undefined) {
                    const el = document.getElementById('sayi');
                    // Sayı değişmişse güncelle ve efekt ver
                    if (el.innerText !== data.miktar.toString()) {
                        el.innerText = data.miktar;
                        el.style.color = "#fff"; // Kısa süreli renk değişimi
                        setTimeout(() => { el.style.color = "#00ffcc"; }, 500);
                    }
                }
            } catch (e) { }
        }

        ilkGiris();
        // Her 3 saniyede bir yeni ziyaretçi var mı diye kontrol et
        setInterval(anlikGuncelle, 3000);
    </script>
    
    <script src="script.js"></script>
</body>
</html>
