<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Blok Patlat</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/grid.css">
    <link rel="stylesheet" href="css/blocks.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div id="game-container">
        <!-- Header -->
        <header class="game-header">
            <h1>🎮 BLOK PATLAT</h1>
            <div class="header-buttons">
                <button id="btn-settings" class="icon-btn" title="Ayarlar">⚙️</button>
                <button id="btn-leaderboard" class="icon-btn" title="Skor Tablosu">🏆</button>
            </div>
        </header>

        <!-- Main Game Area -->
        <div class="game-layout">
            <!-- Left Panel: Score -->
            <aside class="left-panel">
                <div class="score-card">
                    <div class="score-label">SKOR</div>
                    <div id="score" class="score-value">0</div>
                </div>
                <div class="score-card">
                    <div class="score-label">EN YÜKSEK</div>
                    <div id="high-score" class="score-value">0</div>
                </div>
                <div class="score-card">
                    <div class="score-label">COMBO</div>
                    <div id="combo" class="combo-value">x1</div>
                </div>
                <div class="score-card">
                    <div class="score-label">SEVİYE</div>
                    <div id="level" class="level-value">1 ⭐</div>
                </div>
            </aside>

            <!-- Center: Grid -->
            <main class="grid-area">
                <div id="grid" class="grid"></div>
                <div id="combo-text" class="combo-text"></div>
                <div id="particles-container" class="particles-container"></div>
            </main>

            <!-- Right Panel: Next Blocks -->
            <aside class="right-panel">
                <div class="next-label">SIRADAKİ BLOKLAR</div>
                <div id="next-blocks" class="next-blocks"></div>
            </aside>
        </div>

        <!-- Bottom Bar -->
        <div class="bottom-bar">
            <div class="mission">🎯 GÜNLÜK GÖREV: 3 combo yap</div>
            <div class="controls">
                <button id="btn-menu" class="game-btn">ANA MENÜ</button>
                <button id="btn-pause" class="game-btn">PAUSE ⏸️</button>
                <button id="btn-restart" class="game-btn">YENİDEN BAŞLAT ↺</button>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="modal hidden">
        <div class="modal-content">
            <h2>GAME OVER</h2>
            <div class="final-score">
                <div class="final-label">SKORUNUZ</div>
                <div id="final-score" class="final-value">0</div>
            </div>
            <div class="modal-buttons">
                <button id="btn-replay" class="game-btn primary">TEKRAR OYNA</button>
                <button id="btn-main-menu" class="game-btn">ANA MENÜ</button>
            </div>
        </div>
    </div>

    <!-- Pause Modal -->
    <div id="pause-modal" class="modal hidden">
        <div class="modal-content">
            <h2>PAUSE</h2>
            <div class="modal-buttons">
                <button id="btn-resume" class="game-btn primary">DEVAM ET</button>
                <button id="btn-restart-pause" class="game-btn">YENİDEN BAŞLAT</button>
                <button id="btn-quit" class="game-btn">ANA MENÜ</button>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/blocks.js"></script>
    <script src="js/grid.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/scoring.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/input.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
