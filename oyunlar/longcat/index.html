<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐱 Longcat</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #1a1a2e;
            display:flex; justify-content:center; align-items:center;
            height:100vh; overflow:hidden;
            touch-action:manipulation;
            font-family:'Segoe UI', system-ui, sans-serif;
            -webkit-tap-highlight-color:transparent;
            user-select:none; -webkit-user-select:none;
        }
        canvas {
            border-radius:14px;
            box-shadow: 0 0 50px rgba(0,0,0,0.7);
            background:#f5f0e8;
            cursor:pointer;
        }
        .hud {
            position:fixed; top:15px; left:50%; transform:translateX(-50%);
            display:flex; gap:15px; z-index:10; pointer-events:none;
        }
        .hud-item {
            background:rgba(0,0,0,0.6); backdrop-filter:blur(10px);
            border:1px solid rgba(255,255,255,0.2);
            padding:10px 20px; border-radius:25px;
            color:#fff; font-weight:700; font-size:15px;
        }
        .hud-item span { color:#FFD700; }
        .btn-group {
            position:fixed; top:15px; right:15px; display:flex; gap:8px; z-index:10;
        }
        .btn {
            background:rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.25);
            color:#fff; padding:10px 16px; border-radius:25px;
            cursor:pointer; font-weight:700; font-size:15px;
            transition:all 0.2s;
        }
        .btn:active { transform:scale(0.92); background:rgba(255,255,255,0.2); }
        .back-btn {
            position:fixed; top:15px; left:15px; z-index:10;
            background:rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.25);
            color:#fff; padding:10px 18px; border-radius:25px;
            cursor:pointer; font-weight:700; font-size:14px;
        }
        .back-btn:active { transform:scale(0.93); }
        .toast {
            position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
            font-size:38px; font-weight:900; pointer-events:none;
            z-index:15; opacity:0; text-shadow:0 0 30px rgba(0,0,0,0.5);
            transition:all 0.3s;
        }
        .toast.win { color:#2ed573; }
        .toast.lose { color:#ff4757; }
        .toast.show { opacity:1; animation:pop 0.5s ease-out; }
        @keyframes pop {
            0%{transform:translate(-50%,-50%) scale(0.3);opacity:0;}
            60%{transform:translate(-50%,-50%) scale(1.2);opacity:1;}
            100%{transform:translate(-50%,-50%) scale(1);opacity:1;}
        }
    </style>
</head>
<body>

<button class="back-btn" onclick="window.location.href='../index.html'">🏠 GERİ DÖN</button>

<div class="hud">
    <div class="hud-item">🐱 Bölüm <span id="lvl">1</span></div>
    <div class="hud-item">🍎 Kalan <span id="rem">0</span></div>
</div>

<div class="btn-group">
    <button class="btn" onclick="resetGame()">🔄 Tekrar</button>
</div>

<canvas id="c"></canvas>

<div class="toast win" id="toastWin">🌟 TAMAMLANDI!</div>
<div class="toast lose" id="toastLose">💥 SIKIŞTIN!</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let bolumler = [];
let currentLevel = 0;
let COLS, ROWS, CELL;
let grid = [];
let snake = [];
let dir = {x:1, y:0};
let nextDir = {x:1, y:0};
let foods = [];
let active = true;
let timer = null;
const SPEED = 150;

// ========== LOCAL STORAGE ==========
function getCompleted() {
    try { return JSON.parse(localStorage.getItem('longcat_done')) || []; }
    catch { return []; }
}
function markCompleted(id) {
    const arr = getCompleted();
    if(!arr.includes(id)) { arr.push(id); localStorage.setItem('longcat_done', JSON.stringify(arr)); }
}

// ========== JSON YÜKLE ==========
async function loadBolumler() {
    try {
        const res = await fetch('bolumler.json');
        const data = await res.json();
        bolumler = data.bolumler;
        console.log('📂 ' + bolumler.length + ' bölüm yüklendi');
    } catch(e) {
        console.warn('JSON yok, rastgele mod');
        bolumler = [];
    }
    startGame();
}

// ========== OYUN ==========
function initCanvas() {
    CELL = Math.min(58, Math.floor(Math.min(window.innerWidth*0.88/COLS, window.innerHeight*0.65/ROWS)));
    canvas.width = COLS * CELL;
    canvas.height = ROWS * CELL;
}

function loadLevel(idx) {
    clearTimeout(timer);
    
    if (idx < bolumler.length) {
        const b = bolumler[idx];
        COLS = b.grid;
        ROWS = b.grid;
        initCanvas();
        
        grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
        
        if (b.engeller) {
            b.engeller.forEach(e => {
                if (e.c >= 0 && e.c < COLS && e.r >= 0 && e.r < ROWS) {
                    grid[e.r][e.c] = 1;
                }
            });
        }
        
        const sx = Math.max(0, Math.min(COLS-1, b.baslangic?.c ?? 1));
        const sy = Math.max(0, Math.min(ROWS-1, b.baslangic?.r ?? Math.floor(ROWS/2)));
        
        snake = [{x: sx, y: sy}];
        
        const yon = b.yon || 'sag';
        if (yon === 'sag') dir = {x:1, y:0};
        else if (yon === 'sol') dir = {x:-1, y:0};
        else if (yon === 'yukari') dir = {x:0, y:-1};
        else dir = {x:0, y:1};
        nextDir = {...dir};
        
        document.getElementById('lvl').textContent = b.id;
        
    } else {
        COLS = 10; ROWS = 10;
        initCanvas();
        grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
        
        const wallCount = Math.floor(COLS * ROWS * 0.25);
        let placed = 0;
        while (placed < wallCount) {
            const c = Math.floor(Math.random() * COLS);
            const r = Math.floor(Math.random() * ROWS);
            if ((c > 2 || r > 3) && grid[r][c] === 0) {
                grid[r][c] = 1;
                placed++;
            }
        }
        
        snake = [{x: 1, y: Math.floor(ROWS/2)}];
        dir = {x:1, y:0};
        nextDir = {x:1, y:0};
        document.getElementById('lvl').textContent = '∞';
    }
    
    foods = [];
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (grid[r][c] === 0 && !(c === snake[0].x && r === snake[0].y)) {
                foods.push({x: c, y: r, eaten: false});
            }
        }
    }
    
    document.getElementById('rem').textContent = foods.length;
    active = true;
    
    console.log('🐱 Bölüm', document.getElementById('lvl').textContent, '| Kedi:', snake[0].x, snake[0].y, '| Yiyecek:', foods.length);
}

function startGame() { 
    currentLevel = 0; 
    loadLevel(0); 
    timer = setTimeout(move, SPEED); 
}

function resetGame() { 
    loadLevel(currentLevel); 
    timer = setTimeout(move, SPEED); 
}

function showToast(won) {
    const el = document.getElementById(won ? 'toastWin' : 'toastLose');
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 1500);
}

function move() {
    if (!active) return;
    
    dir = {...nextDir};
    const head = snake[0];
    const nh = {x: head.x + dir.x, y: head.y + dir.y};
    
    // Duvara çarpma - dur
    if (nh.x < 0 || nh.x >= COLS || nh.y < 0 || nh.y >= ROWS || grid[nh.y][nh.x] === 1) {
        timer = setTimeout(move, SPEED);
        return;
    }
    
    snake.unshift(nh);
    
    let ate = false;
    for (let f of foods) {
        if (!f.eaten && f.x === nh.x && f.y === nh.y) {
            f.eaten = true;
            ate = true;
            break;
        }
    }
    
    if (!ate) snake.pop();
    
    document.getElementById('rem').textContent = foods.filter(f => !f.eaten).length;
    
    // Tamamlandı mı?
    if (foods.every(f => f.eaten)) {
        active = false;
        if (currentLevel < bolumler.length) markCompleted(bolumler[currentLevel].id);
        showToast(true);
        setTimeout(() => {
            currentLevel++;
            loadLevel(currentLevel);
            timer = setTimeout(move, SPEED);
        }, 1200);
        return;
    }
    
    // SIKIŞMA KONTROLÜ - sadece burada ölüm var
    const hc = snake[0];
    const dirs = [{x:1,y:0}, {x:-1,y:0}, {x:0,y:1}, {x:0,y:-1}];
    let stuck = true;
    
    for (const d of dirs) {
        const nx = hc.x + d.x;
        const ny = hc.y + d.y;
        if (d.x === -dir.x && d.y === -dir.y && snake.length > 1) continue;
        if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && grid[ny][nx] !== 1) {
            stuck = false;
            break;
        }
    }
    
    if (stuck) {
        active = false;
        showToast(false);
        console.log('💥 Sıkıştı!');
        setTimeout(() => {
            loadLevel(currentLevel);
            timer = setTimeout(move, SPEED);
        }, 1200);
        return;
    }
    
    timer = setTimeout(move, SPEED);
}

// ========== ÇİZİM ==========
function draw() {
    ctx.fillStyle = '#f5f0e8';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.strokeStyle = '#e0d8c8';
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= COLS; i++) {
        ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, canvas.height); ctx.stroke();
    }
    for (let i = 0; i <= ROWS; i++) {
        ctx.beginPath(); ctx.moveTo(0, i*CELL); ctx.lineTo(canvas.width, i*CELL); ctx.stroke();
    }
    
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (grid[r][c] === 1) {
                ctx.fillStyle = '#8B7355';
                ctx.fillRect(c*CELL+2, r*CELL+2, CELL-4, CELL-4);
                ctx.fillStyle = '#6B5340';
                ctx.fillRect(c*CELL+4, r*CELL+4, CELL-8, CELL-8);
            }
        }
    }
    
    const t = Date.now() / 300;
    foods.forEach(f => {
        if (!f.eaten) {
            const fx = f.x * CELL + CELL/2;
            const fy = f.y * CELL + CELL/2;
            const pulse = 1 + Math.sin(t + f.x) * 0.15;
            const r = CELL * 0.22 * pulse;
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath(); ctx.arc(fx, fy, r, 0, Math.PI*2); ctx.fill();
        }
    });
    
    for (let i = snake.length - 1; i >= 0; i--) {
        const s = snake[i];
        const cx = s.x * CELL + CELL/2;
        const cy = s.y * CELL + CELL/2;
        const r = CELL * 0.42;
        
        if (i === 0) {
            ctx.fillStyle = '#FF9800';
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#CC3300'; ctx.lineWidth = 2.5; ctx.stroke();
            ctx.fillStyle = '#FF9800';
            ctx.beginPath(); ctx.moveTo(cx-r*.5, cy-r*.4); ctx.lineTo(cx-r*.1, cy-r*1.1); ctx.lineTo(cx+r*.15, cy-r*.4); ctx.fill();
            ctx.beginPath(); ctx.moveTo(cx+r*.5, cy-r*.4); ctx.lineTo(cx+r*.1, cy-r*1.1); ctx.lineTo(cx-r*.15, cy-r*.4); ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(cx-r*.28, cy-r*.1, r*.22, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx+r*.28, cy-r*.1, r*.22, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(cx-r*.28+dir.x*r*.05, cy-r*.1+dir.y*r*.05, r*.1, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx+r*.28+dir.x*r*.05, cy-r*.1+dir.y*r*.05, r*.1, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#FF5252';
            ctx.beginPath(); ctx.arc(cx, cy+r*.08, r*.08, 0, Math.PI*2); ctx.fill();
        } else if (i === snake.length - 1) {
            ctx.fillStyle = '#FFB74D';
            ctx.beginPath(); ctx.arc(cx, cy, r*.55, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(cx, cy, r*.2, 0, Math.PI*2); ctx.fill();
        } else {
            ctx.fillStyle = '#FF9800';
            ctx.beginPath(); ctx.arc(cx, cy, r*.8, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#CC3300'; ctx.lineWidth = 1.5; ctx.stroke();
        }
    }
}

function gameLoop() { draw(); requestAnimationFrame(gameLoop); }

// ========== KONTROLLER ==========
function chDir(dx, dy) {
    if (dx === -dir.x && dy === -dir.y && snake.length > 1) return;
    nextDir = {x: dx, y: dy};
}

let tx=0, ty=0, dragging=false;
canvas.addEventListener('pointerdown', e => { tx=e.clientX; ty=e.clientY; dragging=true; e.preventDefault(); });
canvas.addEventListener('pointermove', e => {
    if (!dragging || !active) return;
    const dx = e.clientX-tx, dy = e.clientY-ty;
    if (Math.abs(dx)>10 || Math.abs(dy)>10) {
        if (Math.abs(dx) > Math.abs(dy)) chDir(dx>0?1:-1, 0);
        else chDir(0, dy>0?1:-1);
        tx=e.clientX; ty=e.clientY;
    }
    e.preventDefault();
});
canvas.addEventListener('pointerup', () => { dragging=false; });
canvas.addEventListener('pointerleave', () => { dragging=false; });

document.addEventListener('keydown', e => {
    if (!active) return;
    const k = e.key.toLowerCase();
    if (k==='w'||k==='arrowup') { e.preventDefault(); chDir(0,-1); }
    if (k==='s'||k==='arrowdown') { e.preventDefault(); chDir(0,1); }
    if (k==='a'||k==='arrowleft') { e.preventDefault(); chDir(-1,0); }
    if (k==='d'||k==='arrowright') { e.preventDefault(); chDir(1,0); }
});

window.addEventListener('resize', () => { if(COLS&&ROWS) initCanvas(); });

// ========== BAŞLAT ==========
loadBolumler();
gameLoop();
</script>
</body>
</html>
